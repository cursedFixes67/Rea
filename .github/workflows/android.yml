# Generated with CodeRabbit. CI verification keys cannot update production releases.
name: Android verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Flutter
        shell: bash
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin c197ca5199e9ee5661e865596c9c07294dfab51c
          git -C "$RUNNER_TEMP/flutter" checkout FETCH_HEAD
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Prepare Android SDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Create disposable CI verification key
        shell: bash
        run: |
          umask 077
          openssl rand -base64 32 > "$RUNNER_TEMP/signing-password"
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -storepass:file "$RUNNER_TEMP/signing-password" -keypass:file "$RUNNER_TEMP/signing-password" -alias ci -keyalg RSA -keysize 3072 -validity 2 -dname 'CN=Dream Reader CI verification'
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          password = (root / 'signing-password').read_text().strip()
          (root / 'signing.properties').write_text(f'storeFile={root}/ci.jks\nstorePassword={password}\nkeyAlias=ci\nkeyPassword={password}\n')
          PY
      - name: Analyze, test, build and verify ARM64
        env:
          DREAM_READER_SIGNING_PROPERTIES: ${{ runner.temp }}/signing.properties
        run: scripts/build_release.sh
      - name: Prepare accelerated Android device
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-35;google_apis;x86_64' 'emulator'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name dream-ci --package 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd dream-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          timeout 240 bash -c 'until [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 3; done'
          "$ANDROID_HOME/platform-tools/adb" shell settings put global window_animation_scale 0
          "$ANDROID_HOME/platform-tools/adb" shell settings put global transition_animation_scale 0
          "$ANDROID_HOME/platform-tools/adb" shell settings put global animator_duration_scale 0
      - name: Test real source journey in release mode
        env:
          DREAM_READER_SIGNING_PROPERTIES: ${{ runner.temp }}/signing.properties
        run: |
          flutter build apk --release --target-platform android-x64 -t integration_test/source_journey_test.dart
          flutter drive --release -d emulator-5554 --driver test_driver/integration_test.dart --target integration_test/source_journey_test.dart --use-application-binary build/app/outputs/flutter-apk/app-release.apk
      - name: Install and launch ARM64 artifact
        run: |
          "$ANDROID_HOME/platform-tools/adb" install -r build/release/DreamReader-arm64-release.apk
          "$ANDROID_HOME/platform-tools/adb" logcat -c
          "$ANDROID_HOME/platform-tools/adb" shell am force-stop com.dreamreader.app
          "$ANDROID_HOME/platform-tools/adb" shell am start -W -n com.dreamreader.app/.MainActivity
          sleep 15
          "$ANDROID_HOME/platform-tools/adb" shell pidof com.dreamreader.app
          "$ANDROID_HOME/platform-tools/adb" logcat -d -b crash > "$RUNNER_TEMP/app-crash.log"
          if rg 'FATAL EXCEPTION|Fatal signal' "$RUNNER_TEMP/app-crash.log"; then exit 1; fi
          "$ANDROID_HOME/platform-tools/adb" exec-out screencap -p > "$RUNNER_TEMP/arm64-launch.png"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-device-evidence
          path: |
            ${{ runner.temp }}/emulator.log
            ${{ runner.temp }}/app-crash.log
            ${{ runner.temp }}/arm64-launch.png
          retention-days: 7
      - name: Label verification artifact
        run: mv build/release/DreamReader-arm64-release.apk build/release/DreamReader-arm64-ci-verification.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DreamReader-arm64-ci-verification
          path: build/release/DreamReader-arm64-ci-verification.apk
          retention-days: 7
      - name: Remove disposable credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/ci.jks" "$RUNNER_TEMP/signing-password" "$RUNNER_TEMP/signing.properties"
